services:
  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flashlights
      POSTGRES_PASSWORD: flashlights
      POSTGRES_DB: flashlights
      POSTGRES_HOST_AUTH_METHOD: trust  # never do this in production!
      POSTGRES_FSYNC: null
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flashlights", "-d", "flashlights"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./docker-compose/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-bullseye
    ports:
      - "6379:6379"
    healthcheck:
     test: ["CMD", "redis-cli","ping"]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 10s

  web:
    build:
      target: dev
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-}
    image: flashlights-web:docker-compose
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - ./media:/code/media
    ports:
      - "8000:8000"
    # The health route the hosts probe; a production stack built from this
    # file keeps the same check against the published image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      DEBUG: True
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      SECRET_KEY: verysecure
      DATABASE_URL: postgresql://flashlights:flashlights@postgres:5432/flashlights
      DJANGO_DEFAULT_FROM_EMAIL: Flashlights <flashlights@example.com>
      DJANGO_EMAIL_HOST: maildev
      # Instance identity; portal/branding.py lists every key.
      SITE_TITLE: Flashlights (dev)
      SITE_SHORT_NAME: Flashlights
      BRAND_PRESET: teal
      # Feature switches, passed through from the shell: VOLUNTEERING_ENABLED=false make serve
      VOLUNTEERING_ENABLED: ${VOLUNTEERING_ENABLED:-true}
      SPONSORSHIP_ENABLED: ${SPONSORSHIP_ENABLED:-true}
      STATS_PUBLIC: ${STATS_PUBLIC:-true}
      DJANGO_EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  
  celery:
    build:
      target: dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        WHISPER_MODEL: ${WHISPER_MODEL:-}
    image: flashlights-celery:docker-compose
    # The minimum formation, as in production: one worker for both queues
    # with beat embedded (bin/worker).
    command: sh bin/worker
    working_dir: /code
    volumes:
      - .:/code
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://flashlights:flashlights@postgres:5432/flashlights
      SECRET_KEY: verysecure
      DEBUG: True
      # The worker sends the emails, so it needs the same email config as web;
      # without DJANGO_EMAIL_HOST settings falls back to the console backend.
      DJANGO_DEFAULT_FROM_EMAIL: Flashlights <flashlights@example.com>
      DJANGO_EMAIL_HOST: maildev
      DJANGO_EMAIL_PORT: 1025
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    restart: unless-stopped

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  pgdata:
