# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Tiny Little Flashlights
# The docs site is not published yet; this is where it will live.
site_url: https://mariatta.github.io/flashlights/
theme:
  name: material
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  favicon: assets/favicon.svg
  palette:
    primary: "black"
    accent: "yellow"
  features:
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.action.edit
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Developer Guide:
    - Setup Guide: developer/setup.md
    - Working on the code: developer/contributing.md
    - How Tos: developer/howto.md
    - Markdown Emails: developer/markdown-emails.md
    - Deployment: developer/deployment.md
    - Releasing: developer/releasing.md
    - Environment reference: developer/environment.md
    - Community apps: developer/community_apps.md
    - Design System: developer/design.md
    - Third-party code: developer/third_party.md
  - Architecture:
    - Multi-Year Conferences: architecture/multi-year-conferences.md
    - Multi-Year Progress: architecture/multi-year-progress.md
    - Signup Abuse Protection: architecture/signup-abuse-protection.md
    - Pretix Per Conference: architecture/pretix-per-conference.md
    - Session and Presenter Addresses: architecture/session-and-presenter-addresses.md
    - Speaker Portal: architecture/speaker-portal.md
    - Email Delivery: architecture/email-delivery.md
    - Permissions: architecture/permissions.md
  - User Guide:
    - Get started: user/get_started.md
    - Adapting Flashlights: user/adapting.md
    - Core Team: user/core_team.md
    - Volunteers: user/volunteer.md
    - Speakers: user/speakers.md
    - Your video and files: user/speaker_files.md
    - Inviting Speakers: user/organizer_invite_speakers.md
    - Sponsors: user/sponsor.md
  - Policy templates:
    - Terms of service: policies/terms_of_use.md
    - Acceptable use policy: policies/acceptable_use_policy.md
repo_url: https://github.com/mariatta/flashlights
repo_name: mariatta/flashlights
edit_uri: edit/main/docs/
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mariatta/flashlights
      name: The repository
plugins:
  - social
  - tags
  - rss
  - git-revision-date-localized:
      enable_creation_date: true
  # Asks GitHub for each page's authors; off until the repository is
  # public. Set MKDOCS_GIT_COMMITTERS=true to turn it on.
  - git-committers:
      enabled: !ENV [MKDOCS_GIT_COMMITTERS, false]
      repository: mariatta/flashlights
      branch: main
  - mkdocstrings:
      handlers:
        python:
          enable_parallel_processing: false
