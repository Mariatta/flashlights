<div class="container border rounded-3 p-3 mb-4">
    <div class="row">
        <div class="col-sm-3">
            <div class="card border-0">
                <div class="card-body">
                    <h5 class="card-title">
                        Volunteers Signed Up
                    </h5>
                    <p class="display-4 text-primary mb-0">
                        {{ stats.volunteer_signups_count }}
                    </p>
                    <span class="text-muted">for {{ stats.volunteer_teams_count }} teams</span>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card border-0">
                <div class="card-body">
                    <h5 class="card-title">
                        Volunteers Onboarded
                    </h5>
                    <p class="display-4 text-success mb-0">
                        {{ stats.volunteer_onboarded_count }}
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
