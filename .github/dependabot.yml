# Pull requests for new releases, once a week, and security alerts for every
# pinned dependency. A pull request for a browser library (the npm entries)
# also needs its files copied: check out the branch, run
# npm ci && npm run vendor, commit and push; tests fail until then.
# docs/developer/third_party.md has the details.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      build-tools:
        patterns: ["terser"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The full image installs faster-whisper, whose onnxruntime has wheels up
    # to Python 3.14 (1.31.1, October 2026). Lift this once
    # onnxruntime publishes a 3.15 wheel.
    ignore:
      - dependency-name: python
        versions: [">= 3.15"]
